<!DOCTYPE html>
<html lang="en" data-version="0.35">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0d0221">
<meta name="description" content="Interactive 3D Rubik's Cube: timed challenge and guided practice." data-i18n-attr="content:app.description">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!--PWA: can be installed and opens offline-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rubik's Cube" data-i18n-attr="content:app.pwaTitle">
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<title>Rubik's Cube · byarcy · v0.35</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="m-challenge">
  <div class="top">
    <div class="titleRow">
      <div class="lgrp"><div class="logo"><span data-i18n="app.logo"></span></div><button class="sizebtn" id="sizeBtn" data-i18n-attr="aria-label:size.label,data-tip:size.tip">3×3</button></div>
      <div class="right">
        <span class="saved" id="saved" role="img"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
        <button class="help-btn" id="helpBtn" data-i18n-attr="aria-label:help.open"><span>?</span></button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabChallenge" data-i18n="tab.challenge"></button>
      <button class="tab" id="tabPractice" data-i18n="tab.practice"></button>
    </div>
  </div>

  <div class="sub" id="challengeBar">
    <div class="trow"><div class="timeVal" id="timeVal">00:00.00</div><button class="pausebtn" id="pauseBtn" data-i18n-attr="aria-label:challenge.pause,data-tip:challenge.pause"><span id="pauseIco"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14M15 5v14"></path></svg></span></button></div>
    <div class="stats"><span><span data-i18n="challenge.moves"></span> <b id="movesVal">0</b></span><span><span data-i18n="challenge.best"></span> <b class="best" id="bestVal">--:--.--</b></span></div>
  </div>

  <div class="sub" id="practiceBar" hidden>
    <div class="stages" id="stages" role="img"></div>
    <div class="stage-text" id="stageText"></div>
  </div>

  <div id="stage">
    <button class="restore" id="restore" data-i18n-attr="aria-label:view.aria,data-tip:view.tip"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg></button>
    <div class="mini" id="miniFrame" aria-hidden="true"></div>
    <div class="tip" id="tip"></div>
    <div class="ring" id="solvedRing" aria-hidden="true"></div>
    <div class="solved" id="solvedMsg" role="status"></div>
    <div class="pause" id="pauseOv" data-i18n="overlay.paused" hidden></div>
    <button class="neon c rearm" id="rearm" data-i18n="overlay.reassemble" hidden></button>
    <div class="stbar">
      <button class="sb v" id="bUndo" data-i18n-attr="aria-label:btn.undo,data-tip:btn.undo"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
      <button class="sb p" id="bTurns" data-i18n-attr="aria-label:btn.turns,data-tip:btn.turns"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></button>
      <button class="sb c" id="bScramble" data-i18n-attr="aria-label:btn.scramble,data-tip:btn.scramble"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></button>
    </div>
  </div>

  <div id="panel">
    <section id="challengePanel">
      <div class="msg" id="challengeMsg"></div>
    </section>
    <section id="practicePanel" hidden>
      <div class="levels lesson-tabs" id="lessons" role="group" data-i18n-attr="aria-label:practice.lesson">
        <button data-lesson="cross" data-i18n="lesson.cross"></button>
        <button data-lesson="corners" data-i18n="lesson.corners"></button>
      </div>
      <div class="practice-head"><div class="practice-title" id="practiceTitle"></div><div class="practice-count" id="practiceCount"></div></div>
      <div class="practice-msg" id="practiceMsg" role="status"></div>
      <div class="practice-seq" id="practiceSeq" data-i18n-attr="aria-label:practice.turns"></div>
      <div class="levels" id="levels" role="group" data-i18n-attr="aria-label:practice.level">
        <button data-level="1" data-i18n="level.1"></button>
        <button data-level="2" data-i18n="level.2"></button>
        <button data-level="3" data-i18n="level.3"></button>
      </div>
      <button class="neon c practice-new" id="practiceNew" data-i18n="practice.new"></button>
    </section>
  </div>

  <div class="gloss" id="gloss" role="status" hidden></div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="handle"></div>
    <div class="dhead">
      <div><div class="dtitle" data-i18n="drawer.title"></div><div class="dsub" data-i18n="drawer.sub"></div></div>
      <button class="iconbtn" id="dClose" data-i18n-attr="aria-label:drawer.close"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div class="turnGrid" id="turnGrid"></div>
  </div>

  <div class="help" id="help" hidden>
    <div class="hhead">
      <div class="htitle" data-i18n="help.title"></div>
      <button class="iconbtn" id="hClose" data-i18n-attr="aria-label:help.close"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e9e3ff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div class="htabs">
      <button class="on" data-help-tab="use" data-i18n="help.tab.use"></button>
      <button data-help-tab="notation" data-i18n="help.tab.notation"></button>
    </div>
    <div class="hlang"><label for="langSel" data-i18n="help.language"></label><select id="langSel"></select></div>
    <div class="hbody">
      <section class="hsec" data-help-panel="use">
        <ul>
          <li data-i18n-html="help.use.1"></li>
          <li data-i18n-html="help.use.2"></li>
          <li data-i18n-html="help.use.3"></li>
          <li data-i18n-html="help.use.4"></li>
          <li data-i18n-html="help.use.5"></li>
          <li data-i18n-html="help.use.6"></li>
          <li data-i18n-html="help.use.7"></li>
          <li data-i18n-html="help.use.8"></li>
          <li data-i18n-html="help.use.9"></li>
          <li data-i18n-html="help.use.10"></li>
        </ul>
      </section>
      <section class="hsec" data-help-panel="notation" hidden>
        <p data-i18n="not.intro"></p>
        <div class="lgrid">
          <div class="lcell"><b>R</b><span data-i18n-html="not.R"></span></div>
          <div class="lcell"><b>L</b><span data-i18n-html="not.L"></span></div>
          <div class="lcell"><b>U</b><span data-i18n-html="not.U"></span></div>
          <div class="lcell"><b>D</b><span data-i18n-html="not.D"></span></div>
          <div class="lcell"><b>F</b><span data-i18n-html="not.F"></span></div>
          <div class="lcell"><b>B</b><span data-i18n-html="not.B"></span></div>
          <div class="lcell c"><b>R'</b><span data-i18n="not.prime"></span></div>
          <div class="lcell c"><b>R2</b><span data-i18n="not.half"></span></div>
        </div>
        <p data-i18n="not.outro"></p>
      </section>
    </div>
